openapi: 3.1.0
info:
  title: Tasks API
  description: |
    REST API for managing tasks. Supports listing, fetching by id,
    creating, partially updating and deleting tasks.
  version: 1.0.0
  license:
    name: CC0-1.0
    url: https://creativecommons.org/publicdomain/zero/1.0/
servers:
  - url: http://localhost
security: []
paths:
  /tasks:
    get:
      operationId: listTasks
      summary: List all tasks
      tags:
        - tasks
      responses:
        '200':
          description: A list of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
    post:
      operationId: createTask
      summary: Create a task
      tags:
        - tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreate'
      responses:
        '201':
          description: The created task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      operationId: getTaskById
      summary: Get a task by id
      tags:
        - tasks
      responses:
        '200':
          description: The requested task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateTask
      summary: Partially update a task
      tags:
        - tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskPatch'
      responses:
        '200':
          description: The updated task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/MalformedBody'
        '422':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteTask
      summary: Delete a task by id
      tags:
        - tasks
      responses:
        '204':
          description: The task was deleted
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: The id of the task
      schema:
        type: integer
  schemas:
    Task:
      type: object
      description: A task
      properties:
        id:
          type: integer
          description: The unique identifier of the task
          readOnly: true
        title:
          type: string
          description: The title of the task
        description:
          type: string
          description: An optional description of the task
        completed:
          type: boolean
          description: Whether the task is completed
      required:
        - id
        - title
        - completed
      example:
        id: 1
        title: Write the OpenAPI specification
        description: Create a valid openapi.yaml for the tasks API
        completed: false
    TaskCreate:
      type: object
      description: Fields for creating a task. The id is generated by the server.
      properties:
        title:
          type: string
          description: The title of the task
        description:
          type: string
          description: An optional description of the task
        completed:
          type: boolean
          description: Whether the task is completed
          default: false
      required:
        - title
      additionalProperties: false
      example:
        title: Write the OpenAPI specification
        description: Create a valid openapi.yaml for the tasks API
        completed: false
    TaskPatch:
      type: object
      description: Fields for partially updating a task. All fields are optional.
      properties:
        title:
          type: string
          description: The title of the task
        description:
          type: string
          description: An optional description of the task
        completed:
          type: boolean
          description: Whether the task is completed
      additionalProperties: false
      example:
        completed: true
    Error:
      type: object
      description: A human-readable error message
      properties:
        error:
          type: string
          description: A message in English describing the error
      required:
        - error
      example:
        error: Task not found
  responses:
    MalformedBody:
      description: The request body is malformed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Malformed request body
    ValidationError:
      description: The request body failed validation
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Validation failed
    NotFound:
      description: The requested resource was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Task not found